name: kitsplit CI

on:
  push:
    paths: ["kitsplit/**", ".github/workflows/kitsplit-ci.yml", ".gitmodules"]
  pull_request:
    paths: ["kitsplit/**", ".github/workflows/kitsplit-ci.yml", ".gitmodules"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: kitsplit
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Checkout pinned MSST submodule
        run: git submodule update --init --depth 1 kitsplit/third_party/Music-Source-Separation-Training
        working-directory: .
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,onnx,msst,data]"
      - name: Tests (not quality, CPU)
        run: |
          set -o pipefail
          python -m pytest -m "not quality" -q --junitxml=test-results.xml 2>&1 | tee test-log.txt
      - name: README claims are generated, not hand-edited
        run: python scripts/update_readme_claims.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-log-py${{ matrix.python }}
          path: |
            kitsplit/test-log.txt
            kitsplit/test-results.xml
